<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brown HQ</title>
<meta name="apple-mobile-web-app-title" content="Brown HQ">
<meta name="theme-color" content="#111110">
<link rel="apple-touch-icon" href="hq-icon-180.png">
<link rel="icon" type="image/png" href="hq-icon-192.png">
<link rel="manifest" href="hq.webmanifest">
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#111110;color:#F7F4EE;font:17px/1.5 -apple-system,system-ui,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:32px max(20px,env(safe-area-inset-left))}
img{width:132px;height:132px;border-radius:28px}
h1{font:600 30px/1.1 "Bodoni 72",Didot,Georgia,serif;margin:0}
a.btn{display:inline-block;background:#F7F4EE;color:#111110;text-decoration:none;font-weight:700;padding:15px 28px;border-radius:12px}
ol{text-align:left;max-width:340px;margin:0;padding-left:22px;color:#CFC9BF}
p{margin:0;color:#A39E95;font-size:15px}
</style>
</head>
<body>
<main>
  <img src="hq-icon-512.png" alt="Brown family CRB monogram">
  <h1>Brown Family Life HQ</h1>
  <a class="btn" id="go" href="https://claude.ai/artifact/BzCrW6DPhGrhJuTP18ju6j">Open Life HQ</a>
  <ol id="setup" hidden>
    <li>Tap the <b>Share</b> button in Safari.</li>
    <li>Tap <b>Add to Home Screen</b>. The CRB icon is already set.</li>
    <li>Name it <b>Brown HQ</b> and tap <b>Add</b>.</li>
  </ol>
  <p id="note">Opening…</p>
</main>
<script>
(function(){
  var target=document.getElementById('go').href, setup=false;
  try{ if(/[?&]setup/.test(location.search)){sessionStorage.setItem('hq-setup','1');history.replaceState(null,'',location.pathname)}
       setup=sessionStorage.getItem('hq-setup')==='1'; }catch(e){ setup=/[?&]setup/.test(location.search); }
  if(setup){document.getElementById('setup').hidden=false;document.getElementById('note').textContent='Add this page to your Home Screen, then tap the new icon.';return;}
  setTimeout(function(){location.replace(target)},400);
})();
</script>
</body>
</html>
