<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCSA Class Projects — The AI Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #140d0a;
      --card-bg: rgba(31, 20, 15, 0.90);
      --gold: #f59e0b;
      --gold-light: #fbbf24;
      --text: #fdfbf7;
      --text-muted: #b9ad9e;
      --border: rgba(245, 158, 11, 0.20);
      --border-hover: rgba(245, 158, 11, 0.60);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 0 0 80px;
    }
    .nav {
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(20, 13, 10, 0.95);
    }
    .brand { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: #fff; text-decoration: none; }
    .brand span { color: var(--gold); }
    .back-link { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
    .header { text-align: center; padding: 60px 20px 40px; }
    .badge {
      display: inline-block;
      color: var(--gold-light);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid var(--border);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 16px;
    }
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(2rem, 5vw, 3.2rem); margin-bottom: 12px; }
    h1 span { color: var(--gold); }
    .subtitle { color: var(--text-muted); max-width: 620px; margin: 0 auto; font-size: 1rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 22px;
      max-width: 1100px;
      margin: 40px auto 0;
      padding: 0 20px;
    }
    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .project-card:hover { transform: translateY(-4px); border-color: var(--border-hover); }
    .project-tag { color: var(--gold); font-size: 0.75rem; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; }
    .project-card h3 { font-family: 'Space Grotesk', sans-serif; font-size: 1.35rem; margin-bottom: 10px; color: #fff; }
    .project-card p { color: var(--text-muted); font-size: 0.88rem; line-height: 1.5; margin-bottom: 20px; }
    .btn-launch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--gold), #d97706);
      color: #130c08;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 12px 18px;
      border-radius: 10px;
      width: 100%;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="brand">the brown girls <span>creative studio</span></a>
    <a href="index.html" class="back-link">← AI Lab Hub</a>
  </nav>

  <div class="header">
    <span class="badge">Newton County STEAM Academy</span>
    <h1>Student <span>Site Showcase</span></h1>
    <p class="subtitle">Live website prototypes and AI concepts engineered by 8th-grade innovators during Career Day.</p>
  </div>

  <div class="grid" id="projects-container">
    <!-- Individual team cards will render here -->
  </div>
</body>
</html>
